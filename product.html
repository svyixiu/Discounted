<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <base href="/" />
    <meta name="theme-color" content="#242320" />
    <meta name="color-scheme" content="dark" />
    <title>Discounted — Deal</title>
    <meta
      name="description"
      content="View a Steam deal and related recommendations on Discounted."
    />
    <link rel="icon" type="image/svg+xml" href="/assets/discounted.svg" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/theme.css" />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Discounted — Steam deals without the digging."
    />
    <meta
      property="og:description"
      content="Browse researched Steam discounts on games, DLC and bundles."
    />
    <meta
      property="og:image"
      content="https://discounted.vercel.app/og-image.png"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Discounted — Steam deals without the digging."
    />
    <meta
      name="twitter:image"
      content="https://discounted.vercel.app/og-image.png"
    />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      href="/assets/space-grotesk-bold.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div class="product-backdrop" aria-hidden="true"></div>
    <svg class="sprite" aria-hidden="true" focusable="false">
      <symbol id="i-gamepad" viewBox="0 0 24 24">
        <path
          d="M7.5 7.5h9a4.5 4.5 0 0 1 4.1 6.4l-1.3 2.8a2.5 2.5 0 0 1-3.8.9l-1.5-1.3H10l-1.5 1.3a2.5 2.5 0 0 1-3.8-.9l-1.3-2.8a4.5 4.5 0 0 1 4.1-6.4Z"
        />
        <path d="M7.5 11v4M5.5 13h4" />
      </symbol>
      <symbol id="i-puzzle" viewBox="0 0 24 24">
        <path
          d="M4 4h6v3a2 2 0 1 0 4 0V4h6v6h-3a2 2 0 1 0 0 4h3v6h-6v-3a2 2 0 1 0-4 0v3H4v-6h3a2 2 0 1 0 0-4H4Z"
        />
      </symbol>
      <symbol id="i-box" viewBox="0 0 24 24">
        <path d="m4 7 8-4 8 4-8 4Z" />
        <path d="M4 7v10l8 4 8-4V7" />
      </symbol>
      <symbol id="i-grid" viewBox="0 0 24 24">
        <rect x="4" y="4" width="6" height="6" rx="1" />
        <rect x="14" y="4" width="6" height="6" rx="1" />
        <rect x="4" y="14" width="6" height="6" rx="1" />
        <rect x="14" y="14" width="6" height="6" rx="1" />
      </symbol>
      <symbol id="i-external" viewBox="0 0 24 24">
        <path d="M14 4h6v6" />
        <path d="m20 4-9 9" />
        <path
          d="M18 14v4.5A1.5 1.5 0 0 1 16.5 20h-11A1.5 1.5 0 0 1 4 18.5v-11A1.5 1.5 0 0 1 5.5 6H10"
        />
      </symbol>
      <symbol id="i-image" viewBox="0 0 24 24">
        <rect x="3.5" y="4.5" width="17" height="15" rx="2" />
        <circle cx="9" cy="10" r="1.5" />
        <path d="m5.5 17 4.2-4.2 3 3 2.2-2.2 3.6 3.4" />
      </symbol>
      <symbol id="i-left" viewBox="0 0 24 24">
        <path d="M19 12H5" />
        <path d="m10 7-5 5 5 5" />
      </symbol>
    </svg>

    <main id="main-content" class="product-page">
      <div class="wrap">
        <div class="page-brandline">
          <a class="brand" href="/"
            ><img
              class="brand-logo"
              src="/assets/discounted.svg"
              width="36"
              height="36"
              alt=""
            /><span>Discounted</span></a
          >
          <nav>
            <label class="tag-control product-currency">
              <span>Currency</span>
              <select id="currencySelect" aria-label="Currency">
                <option value="USD">USD</option>
              </select>
            </label>
            <a href="/"
              ><svg class="i i-sm"><use href="#i-left" /></svg> Back to deals</a
            >
          </nav>
        </div>

        <section id="productView" class="product-hero" hidden>
          <div id="productMedia" class="product-hero-media">
            <span class="thumb-fallback"
              ><svg class="i"><use href="#i-image" /></svg
            ></span>
            <img
              id="productImage"
              alt=""
              decoding="async"
              referrerpolicy="no-referrer"
            />
          </div>

          <article class="product-hero-info">
            <div id="productType" class="product-kicker"></div>
            <h1 id="productTitle"></h1>
            <p id="productGroup" class="product-sub"></p>

            <div class="product-buybox">
              <span id="productDiscount" class="detail-discount"></span>
              <div class="detail-prices">
                <strong id="productPrice"></strong>
                <s id="productWas"></s>
              </div>
              <p id="productSaving" class="product-sub"></p>

              <div
                id="priceBreakdown"
                class="price-breakdown"
                aria-label="Sale price relative to original"
              >
                <i></i>
              </div>
              <span id="productTimer" class="countdown"></span
              ><span id="productTrust" class="trust"></span>
              <div class="detail-actions">
                <a
                  id="steamButton"
                  class="store-button"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  Open on Steam
                  <svg class="i i-sm"><use href="#i-external" /></svg>
                </a>
                <button class="store-button secondary" data-copy="">
                  Copy link
                </button>
              </div>
            </div>
          </article>
        </section>

        <section id="recommendations" class="recommendations" hidden>
          <p class="eyebrow">You may also like</p>
          <h2>More deals like this</h2>
          <div id="recommendGrid" class="recommend-grid"></div>
        </section>

        <section id="missingProduct" class="empty-state" hidden>
          <strong>Deal not found.</strong>
          <p>This title is not in the current Discounted snapshot.</p>
          <a class="store-button secondary" href="/">Return to catalog</a>
        </section>
      </div>
    </main>

    <footer class="site-footer">
      <div class="wrap footer-inner">
        <a class="brand" href="/"
          ><img
            class="brand-logo"
            src="/assets/discounted.svg"
            width="30"
            height="30"
            alt=""
          /><span>Discounted</span></a
        >
        <span>Steam promotions can change.</span>
        <div class="footer-links">
          <a href="/how-it-works.html" target="_blank" rel="noopener"
            >How it works</a
          ><a
            href="https://github.com/svyixiu/Discounted"
            target="_blank"
            rel="noopener noreferrer"
            >Source</a
          >
        </div>
      </div>
    </footer>

    <script src="/vault.js" defer></script>
    <script src="/product.js" defer></script>
  </body>
</html>
