<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#242320" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/theme.css" />
    <link rel="icon" href="/favicon.svg" />
    <title>Nothing buried here — Discounted</title>
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Discounted — Steam deals without the digging."
    />
    <meta
      property="og:description"
      content="Browse researched Steam discounts on games, DLC and bundles."
    />
    <meta
      property="og:image"
      content="https://discounted.vercel.app/og-image.png"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Discounted — Steam deals without the digging."
    />
    <meta
      name="twitter:image"
      content="https://discounted.vercel.app/og-image.png"
    />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      href="/assets/space-grotesk-bold.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="masthead">
      <a class="brand" href="/"
        ><img
          class="brand-logo"
          src="/assets/logo-mark.svg"
          width="34"
          height="34"
          alt=""
        />Discounted</a
      >
      <nav class="masthead-links">
        <a href="/how-it-works.html">How it works</a
        ><a href="https://github.com/svyixiu/Discounted">Source</a>
      </nav>
    </header>
    <main id="main-content" class="not-found">
      <div class="error-number" aria-label="404">
        404
      </div>
      <h1>That page isn’t here.</h1>
      <p>The link may have changed, or the deal is no longer in our catalog.</p>
      <div class="hero-actions">
        <a class="primary-action" href="/">Browse deals</a
        ><button data-random>Surprise me</button>
      </div>
    </main>
    <footer class="site-footer">
      <div class="wrap footer-inner">
        <a class="brand" href="/"
          ><img
            class="brand-logo"
            src="/assets/logo-mark.svg"
            width="30"
            height="30"
            alt=""
          />Discounted</a
        ><span>Steam promotions can change.</span
        ><a href="https://github.com/svyixiu/Discounted">Source</a>
      </div>
    </footer>
    <script src="/vault.js" defer></script>
  </body>
</html>
